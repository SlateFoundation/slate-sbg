[hololens]
container = "ghcr.io/hologit/lenses/sencha-app:latest"

[hololens.sencha]
app = "SlateStandardsBasedGradingTeacher"

[hololens.input]
root = "sencha-workspace"
files = [
    "SlateStandardsBasedGradingTeacher/**",
    "packages/slate-sbg/**",
    "packages/slate-core-data/**",
    "packages/slate-theme/**",
    "packages/slate-ui-classic/**",
    "packages/emergence-apikit/**",
    "packages/jarvus-apikit/**",
    "packages/jarvus-hotfixes/**",
    "ext/**",
    "workspace.json"
]

[hololens.output]
root = "webapp-builds/SlateStandardsBasedGradingTeacher"
merge = "replace"